[package]
name = "neumannos-kernel"
version = "0.1.0"
edition = "2021"

[dependencies]
bootloader = "0.9.31"
x86_64 = "0.15"
spin = "0.9"
uart_16550 = "0.2"
lazy_static = { version = "1.0", features = ["spin_no_std"] }

[package.metadata.bootimage]
run-args = ["-serial", "stdio"]

[[bin]]
name = "neumannos-kernel"
test = false
bench = false

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
